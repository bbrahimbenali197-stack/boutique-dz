<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Boutique DZ</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body><header><div class="header-inner"><div class="brand">⚙️ Administration</div><div><a class="btn light" href="index.html">Boutique</a> <button class="light" id="logout" style="display:none">Déconnexion</button></div></div></header><main class="container"><div id="message"></div><section id="login" class="card"><h2>Connexion</h2><form id="loginForm"><label>Email</label><input id="email" type="email" required><label>Mot de passe</label><input id="password" type="password" required><br><br><button class="primary">Se connecter</button></form></section><section id="app" style="display:none"><div class="card"><h2 id="title">Ajouter un produit</h2><form id="productForm"><input type="hidden" id="pid"><input type="hidden" id="oldurl"><div class="form-grid"><div><label>Nom *</label><input id="pname" required></div><div><label>Prix DA *</label><input id="price" type="number" min="0" step=".01" required></div><div class="full"><label>Image *</label><input id="file" type="file" accept="image/*"><p class="small">Choisissez une photo depuis le PC ou téléphone. Upload automatique vers Supabase. Maximum 5 Mo.</p><img id="preview" class="preview"></div><div class="full"><label>Description</label><textarea id="desc"></textarea></div><div><label>Actif</label><select id="active"><option value="true">Oui</option><option value="false">Non</option></select></div></div><br><button class="primary" id="save">Ajouter le produit</button> <button class="light" type="button" id="cancel" style="display:none">Annuler</button></form></div><div class="card"><h2>Produits</h2><div class="table-wrap"><table><thead><tr><th>Image</th><th>Produit</th><th>Prix</th><th>Actif</th><th>Actions</th></tr></thead><tbody id="products"></tbody></table></div></div><div class="card"><h2>Commandes</h2><div class="table-wrap"><table><thead><tr><th>Date</th><th>Client</th><th>Téléphone</th><th>Lieu</th><th>Total</th><th>Statut</th></tr></thead><tbody id="orders"></tbody></table></div></div></section></main><script>
const money=n=>new Intl.NumberFormat("fr-DZ").format(n)+" DA";const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));function msg(t,c="notice"){document.getElementById("message").innerHTML=`<div class="notice ${c}">${esc(t)}</div>`}
async function init(){let{data:{session}}=await sb.auth.getSession();session?show():hide();sb.auth.onAuthStateChange((_,s)=>s?show():hide())}function show(){login.style.display="none";app.style.display="block";logout.style.display="inline-block";loadProducts();loadOrders()}function hide(){login.style.display="block";app.style.display="none";logout.style.display="none"}
loginForm.onsubmit=async e=>{e.preventDefault();let{error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(error)msg(error.message,"error")};logout.onclick=()=>sb.auth.signOut();
file.onchange=()=>{let f=file.files[0];if(!f)return;if(!f.type.startsWith("image/"))return msg("Choisissez une image.","error");if(f.size>5242880)return msg("Image trop grande : maximum 5 Mo.","error");preview.src=URL.createObjectURL(f);preview.style.display="block"};
async function upload(f){if(!f)return null;if(!f.type.startsWith("image/"))throw Error("Fichier non image");if(f.size>5242880)throw Error("Image > 5 Mo");let ext=(f.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"");let path=crypto.randomUUID()+"."+ext;let{error}=await sb.storage.from(STORAGE_BUCKET).upload(path,f,{cacheControl:"3600",upsert:false,contentType:f.type});if(error)throw error;return sb.storage.from(STORAGE_BUCKET).getPublicUrl(path).data.publicUrl}
function path(url){let m="/storage/v1/object/public/"+STORAGE_BUCKET+"/",i=(url||"").indexOf(m);return i<0?null:decodeURIComponent(url.slice(i+m.length))}
async function delImage(url){let p=path(url);if(p)await sb.storage.from(STORAGE_BUCKET).remove([p])}
productForm.onsubmit=async e=>{e.preventDefault();let id=pid.value,old=oldurl.value,f=file.files[0];if(!id&&!f)return msg("Choisissez une image.","error");save.disabled=true;save.textContent="Enregistrement...";try{let image=old;if(f)image=await upload(f);let row={name:pname.value.trim(),price:Number(price.value),image_url:image,description:desc.value.trim(),active:active.value==="true"};let r=id?await sb.from("products").update(row).eq("id",id):await sb.from("products").insert(row);if(r.error)throw r.error;if(id&&f&&old&&old!==image)await delImage(old);msg(id?"Produit modifié.":"Produit ajouté.","success");reset();loadProducts()}catch(x){msg("Erreur : "+x.message,"error")}finally{save.disabled=false;save.textContent="Ajouter le produit"}};
function reset(){productForm.reset();pid.value="";oldurl.value="";title.textContent="Ajouter un produit";cancel.style.display="none";preview.style.display="none";save.textContent="Ajouter le produit"}
cancel.onclick=reset;
async function loadProducts(){let{data,error}=await sb.from("products").select("*").order("created_at",{ascending:false});if(error)return msg(error.message,"error");products.innerHTML=(data||[]).map(p=>`<tr><td><img class=admin-thumb src="${esc(p.image_url||"")}"></td><td>${esc(p.name)}<br><span class=small>${esc(p.description||"")}</span></td><td>${money(p.price)}</td><td>${p.active?"Oui":"Non"}</td><td><button class=light onclick='edit(${JSON.stringify(p)})'>Modifier</button> <button class=danger onclick='removeProduct(${JSON.stringify(p)})'>Supprimer</button></td></tr>`).join("")}
function edit(p){pid.value=p.id;oldurl.value=p.image_url||"";pname.value=p.name;price.value=p.price;desc.value=p.description||"";active.value=String(p.active);title.textContent="Modifier le produit";save.textContent="Enregistrer";cancel.style.display="inline-block";if(p.image_url){preview.src=p.image_url;preview.style.display="block"}scrollTo({top:0,behavior:"smooth"})}
async function removeProduct(p){if(!confirm("Supprimer "+p.name+" ?"))return;let{error}=await sb.from("products").delete().eq("id",p.id);if(error)return msg(error.message,"error");if(p.image_url)await delImage(p.image_url);msg("Produit supprimé.","success");loadProducts()}
async function loadOrders(){let{data,error}=await sb.from("orders").select("*").order("created_at",{ascending:false});if(error)return msg(error.message,"error");orders.innerHTML=(data||[]).map(o=>`<tr><td>${new Date(o.created_at).toLocaleString("fr-FR")}</td><td>${esc(o.customer_name)}</td><td>${esc(o.phone)}</td><td>${esc(o.wilaya)} ${esc(o.commune||"")}</td><td>${money(o.total)}</td><td>${esc(o.status||"new")}</td></tr>`).join("")}init();</script></body></html>

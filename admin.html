<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Boutique DZ</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body><header><h1>Administration</h1><a href="index.html">Boutique</a></header><main><section id="login"><h2>Connexion</h2><form id="lf"><input id="email" type="email" placeholder="E-mail" required><input id="password" type="password" placeholder="Mot de passe" required><button>Se connecter</button></form><p id="lm"></p></section><section id="app" hidden><button id="out">Déconnexion</button><h2>Ajouter / modifier un produit</h2><form id="pf"><input id="pid" type="hidden"><input id="name" placeholder="Nom" required><input id="price" type="number" step=".01" placeholder="Prix DA" required><input id="image_url" placeholder="URL image" required><textarea id="description" placeholder="Description"></textarea><label><input id="active" type="checkbox" checked> Visible</label><button>Enregistrer</button></form><div id="list"></div><h2>Commandes</h2><div id="orders"></div></section></main><script>
const $=id=>document.getElementById(id),esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));const money=x=>Number(x).toLocaleString("fr-DZ")+" DA";let all=[];
async function start(){let s=(await sb.auth.getSession()).data.session;if(s)show();else login.hidden=false}function show(){login.hidden=true;app.hidden=false;loadP();loadO()}
lf.onsubmit=async e=>{e.preventDefault();let r=await sb.auth.signInWithPassword({email:$("email").value,password:$("password").value});if(r.error)$("lm").textContent=r.error.message;else show()};out.onclick=async()=>{await sb.auth.signOut();location.reload()};
async function loadP(){let r=await sb.from("products").select("*").order("created_at",{ascending:false});if(r.error){list.textContent=r.error.message;return}all=r.data||[];list.innerHTML=all.map(p=>`<article class="admin"><img src="${esc(p.image_url)}"><span><b>${esc(p.name)}</b> — ${money(p.price)} — ${p.active?"Visible":"Masqué"}</span><button onclick="edit(${p.id})">Modifier</button><button onclick="del(${p.id})">Supprimer</button></article>`).join("")}
window.edit=id=>{let p=all.find(x=>x.id===id);$("pid").value=p.id;$("name").value=p.name;$("price").value=p.price;$("image_url").value=p.image_url;$("description").value=p.description||"";$("active").checked=p.active;scrollTo(0,0)}
window.del=async id=>{if(confirm("Supprimer ?")){let r=await sb.from("products").delete().eq("id",id);if(r.error)alert(r.error.message);loadP()}}
pf.onsubmit=async e=>{e.preventDefault();let id=$("pid").value,row={name:$("name").value,price:Number($("price").value),image_url:$("image_url").value,description:$("description").value,active:$("active").checked};let r=id?await sb.from("products").update(row).eq("id",id):await sb.from("products").insert(row);if(r.error)alert(r.error.message);else{pf.reset();$("pid").value="";$("active").checked=true;loadP()}}
async function loadO(){let r=await sb.from("orders").select("*").order("created_at",{ascending:false});if(r.error){orders.textContent=r.error.message;return}orders.innerHTML=(r.data||[]).map(o=>`<article class="order"><b>#${o.id}</b> ${esc(o.customer_name)} — ${esc(o.phone)} — ${esc(o.wilaya)} — ${money(o.total)}<br>${esc(o.address||"")}<br>Statut: <select onchange="status(${o.id},this.value)">${["new","confirmed","shipped","delivered","cancelled"].map(s=>`<option ${s===o.status?"selected":""}>${s}</option>`).join("")}</select></article>`).join("")||"Aucune commande"}
window.status=async(id,v)=>{let r=await sb.from("orders").update({status:v}).eq("id",id);if(r.error)alert(r.error.message)};start();
</script></body></html>
